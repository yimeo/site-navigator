server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /var/www/site-navigator/public;
    index index.php;
    charset utf-8;
    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_pass unix:/run/php/php7.0-fpm.sock;
        fastcgi_read_timeout 30s;
    }

    location ~* ^/(?:app|config|cron|storage|tests|deploy)/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    access_log /var/log/nginx/site-navigator.access.log;
    error_log /var/log/nginx/site-navigator.error.log warn;
}
